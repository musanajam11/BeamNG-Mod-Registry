name: Inflate NetBeamMod Templates

on:
  schedule:
    - cron: '0 6 * * *'           # Daily at 06:00 UTC
  workflow_dispatch:               # Manual trigger
    inputs:
      identifier:
        description: 'Process a specific mod identifier (leave empty for all)'
        required: false
        type: string
      dry_run:
        description: 'Preview only — do not write files'
        required: false
        type: boolean
        default: false

jobs:
  inflate:
    name: Check for new upstream releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run inflator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.identifier }}" ]; then
            ARGS="$ARGS --id ${{ inputs.identifier }}"
          fi
          node scripts/inflate.mjs $ARGS

      - name: Check for new .beammod files
        id: changes
        run: |
          # Stage additions (new .beammod files) AND removals (purged templates,
          # deleted mods/<id>/ trees, and updated health-state file).
          git add -A mods/ netbeammod/
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            ADDED=$(git diff --cached --name-only --diff-filter=A)
            REMOVED=$(git diff --cached --name-only --diff-filter=D)
            MODIFIED=$(git diff --cached --name-only --diff-filter=M)
            HAS_REMOVALS=false
            if [ -n "$REMOVED" ]; then HAS_REMOVALS=true; fi
            echo "has_removals=$HAS_REMOVALS" >> "$GITHUB_OUTPUT"
            {
              echo "added<<EOF"; echo "$ADDED"; echo "EOF"
              echo "removed<<EOF"; echo "$REMOVED"; echo "EOF"
              echo "modified<<EOF"; echo "$MODIFIED"; echo "EOF"
            } >> "$GITHUB_OUTPUT"
            {
              if [ -n "$ADDED" ]; then echo "### Added"; echo '```'; echo "$ADDED"; echo '```'; fi
              if [ -n "$REMOVED" ]; then echo "### Removed (upstream gone)"; echo '```'; echo "$REMOVED"; echo '```'; fi
              if [ -n "$MODIFIED" ]; then echo "### Modified"; echo '```'; echo "$MODIFIED"; echo '```'; fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate generated files
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          npm install ajv ajv-formats
          node scripts/validate.mjs

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/inflate-${{ github.run_number }}
          commit-message: "${{ steps.changes.outputs.has_removals == 'true' && 'auto: inflate mod registry (includes purges of upstream-gone mods)' || 'auto: inflate mod registry' }}"
          title: "${{ steps.changes.outputs.has_removals == 'true' && 'auto: inflate + purge upstream-gone mods' || 'auto: new upstream mod versions detected' }}"
          body: |
            The inflator processed all `.netbeammod` templates against their upstream sources.

            ### Added
            ```
            ${{ steps.changes.outputs.added }}
            ```

            ### Removed (auto-purge: 5 consecutive 404 streaks)
            ```
            ${{ steps.changes.outputs.removed }}
            ```

            ### Modified
            ```
            ${{ steps.changes.outputs.modified }}
            ```

            **Auto-purge policy:** when `scripts/inflate.mjs` sees an upstream `404`
            for a template, it increments a counter in `netbeammod/.health.json`.
            After `PURGE_THRESHOLD` consecutive failed runs (default **5**, ≈5 days
            on the daily cron), the template, its `mods/<id>/` directory, and the
            health entry are removed. Any successful contact resets the counter,
            so transient outages do not cause data loss.

            Created automatically by the [inflate workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            Review the diff and merge when ready.
          labels: automated,inflate
          delete-branch: true
