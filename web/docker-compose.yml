services:
  registry-web:
    build:
      # Build context is the repo root so we can copy schema/ and scripts/.
      context: ..
      dockerfile: web/Dockerfile
    image: beamng-registry-web:latest
    container_name: registry-web
    restart: unless-stopped
    ports:
      # Host port is configurable. On Unraid set REGISTRY_WEB_PORT in .env.
      - "${REGISTRY_WEB_PORT:-8080}:8080"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "8080"
      HOST: "0.0.0.0"
      DATABASE_PATH: /data/registry-web.db
      REPO_WORKDIR: /data/repo
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/app.pem
    env_file:
      - .env
    volumes:
      # Local dev / Docker Desktop default: ./data and ./secrets next to compose file.
      # On Unraid set DATA_DIR=/mnt/user/appdata/beamng-registry-web in .env
      # and SECRETS_DIR=/mnt/user/appdata/beamng-registry-web/secrets.
      - ${DATA_DIR:-./data}:/data
      - ${SECRETS_DIR:-./secrets}/app.pem:/run/secrets/app.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
